name: CorporateWarfare
options:
  bundleIdPrefix: net.lakesidegames
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
targets:
  CorporateWarfare:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated/cw_ffi.swift
      - path: Assets.xcassets
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.corporatewarfare
        # Merged with the generated Info.plist: the Silkscreen pixel font, and the classic
        # system controls instead of iOS 26 Liquid Glass (the app draws its own solid pixel UI).
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Gold for every system control, sheets included (they do not inherit the root tint).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Corporate Warfare
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The same app runs on the Mac through Mac Catalyst, under the same bundle identifier
        # so one App Store record covers iPhone, iPad and Mac.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": CorporateWarfare.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      # Static library xcframework: link it, never embed it. Embedding copies
      # the loose .a into Frameworks/, which App Store validation rejects
      # (errors 90432 and 90171 on the first upload attempt).
      - framework: Generated/CwEngine.xcframework
        embed: false
  EngineBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CorporateWarfare
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CorporateWarfare
schemes:
  CorporateWarfare:
    build:
      targets:
        CorporateWarfare: all
        EngineBridgeTests: [test]
    test:
      targets: [EngineBridgeTests]
