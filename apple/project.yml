name: CorporateWarfare
options:
  bundleIdPrefix: net.lakesidegames
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
targets:
  CorporateWarfare:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated/cw_ffi.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.corporatewarfare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Corporate Warfare
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: Generated/CwEngine.xcframework
  EngineBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CorporateWarfare
schemes:
  CorporateWarfare:
    build:
      targets:
        CorporateWarfare: all
        EngineBridgeTests: [test]
    test:
      targets: [EngineBridgeTests]
