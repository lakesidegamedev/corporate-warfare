name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog and version gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
            python3 tools/changelog_check.py --base "$BASE_SHA" --body-file "$RUNNER_TEMP/pr-body.txt"
          else
            python3 tools/changelog_check.py
          fi
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p cw-cli -- doctor
      - run: python3 tools/plan_check.py
      - run: python3 tools/design_check.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
