name: Apple smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-apple:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - run: rustup show
      - run: brew install xcodegen
      - run: bash apple/scripts/build-engine.sh
      - run: xcodegen generate --spec apple/project.yml --project apple
      - name: Simulator compile
        run: xcodebuild -project apple/CorporateWarfare.xcodeproj -scheme CorporateWarfare -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Device archive
        run: xcodebuild -project apple/CorporateWarfare.xcodeproj -scheme CorporateWarfare -configuration Release -destination 'generic/platform=iOS' -archivePath apple/build/CorporateWarfare.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-apple-smoke
          path: apple/build/CorporateWarfare.xcarchive
          retention-days: 7
