name: Apple smoke
on:
  # Pull requests run the Mac job only when they touch the app (apple/**) or this workflow, or carry the "ci:apple"
  # label. Rust core changes reach macOS through the nightly run on main and on demand. The changes job decides on
  # an ubuntu runner, so a pull request that does not need macOS never holds one.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths: ["apple/**", ".github/workflows/apple.yml"]
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  # Adding an unrelated label must not cancel a Mac run that is under way, so such events get their own group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:apple') && 'label' || 'run' }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:apple') }}
        run: |
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          case "$EVENT" in
            push|workflow_dispatch) decide true "$EVENT" ;;
            schedule)
              last=$(gh run list -R "$REPO" --workflow "$WORKFLOW" --event schedule --status success -L 1 --json headSha -q '.[0].headSha // ""')
              [ "$last" = "${{ github.sha }}" ] && decide false "main has not moved since the last successful nightly"
              decide true "main moved since the last successful nightly" ;;
            pull_request)
              if [ "$ACTION" = "labeled" ]; then
                [ "$LABEL" = "ci:apple" ] && decide true "ci:apple label added"
                decide false "an unrelated label was added"
              fi
              [ "$HAS_LABEL" = "true" ] && decide true "the pull request carries ci:apple"
              files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename')
              echo "$files" | grep -qE '^(apple/|\.github/workflows/apple\.yml$)' && decide true "the pull request touches the app"
              decide false "no app files changed; add the ci:apple label to run it" ;;
          esac
          decide false "unknown event"

  unsigned-apple:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - run: rustup show
      - name: Privacy audit
        run: python3 apple/scripts/privacy_audit.py
      - run: brew install xcodegen
      - run: bash apple/scripts/build-engine.sh
      - run: xcodegen generate --spec apple/project.yml --project apple
      - name: Simulator compile
        run: xcodebuild -project apple/CorporateWarfare.xcodeproj -scheme CorporateWarfare -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Mac Catalyst compile
        run: xcodebuild -project apple/CorporateWarfare.xcodeproj -scheme CorporateWarfare -configuration Release -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath apple/build/catalyst CODE_SIGNING_ALLOWED=NO build
      - name: Package the Mac app
        run: |
          app=$(find apple/build/catalyst -path '*Release-maccatalyst/*.app' -maxdepth 6 -type d | head -1)
          test -n "$app"
          ditto -c -k --keepParent "$app" apple/build/CorporateWarfare-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: corporate-warfare-mac-unsigned
          path: apple/build/CorporateWarfare-mac.zip
          retention-days: 14
      - name: Execute Rust bridge in simulator
        run: bash apple/scripts/test-simulator.sh
      - name: Collect UI snapshots
        if: always()
        run: |
          mkdir -p apple/build/snapshots apple/build/store-screenshots
          find "$HOME/Library/Developer/CoreSimulator/Devices" \( -name 'cw-snapshot-*.png' -o -name 'cw-store-*.png' \) -newer apple/project.yml -exec cp {} apple/build/snapshots/ \; 2>/dev/null || true
          # App Store sized, alpha-free screenshots for the store listing.
          cp apple/build/snapshots/cw-store-*.png apple/build/store-screenshots/ 2>/dev/null || true
          ls -la apple/build/snapshots apple/build/store-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots
          path: apple/build/store-screenshots
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: apple/build/snapshots
          retention-days: 14
      - name: Device archive
        run: xcodebuild -project apple/CorporateWarfare.xcodeproj -scheme CorporateWarfare -configuration Release -destination 'generic/platform=iOS' -archivePath apple/build/CorporateWarfare.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unsigned-apple-smoke
          path: |
            apple/build/CorporateWarfare.xcarchive
            apple/build/EngineBridge.xcresult
          retention-days: 7
