name: Release Android, Windows, Linux and Mac
# Attaches the non-iPhone builds to a GitHub release: a signed Android App Bundle and APK, the
# Windows installer, the Linux package and AppImage, and the Mac disk image (Mac Catalyst, unsigned until a Mac
# distribution certificate is configured). The bundle is what Google Play accepts; the APK is
# for direct downloads. The iPhone build goes through release.yml.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.4.0"
        required: true
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  android:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup show
      - run: bash compose/scripts/build-engine.sh android
      - name: Signed release bundle and APK
        working-directory: compose
        env:
          CW_ANDROID_KEY_PASSWORD: ${{ secrets.CW_ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.CW_ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "blocked: Android signing secrets missing" >&2; exit 2; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          CW_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon :androidApp:bundleRelease
          # AGP cannot build per-ABI APKs and a bundle in one run, so the APKs are a second run.
          CW_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon :androidApp:assembleRelease -Pcw.splitAbi=true
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          # The direct download is arm64-v8a only; emulators use the x86_64 APK from the CI artifacts.
          apk=androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk
          # Play only accepts an App Bundle; the APK stays for direct downloads.
          jarsigner -verify "$aab" | grep -q "jar verified"
          unzip -l "$aab" | grep -q "base/manifest/AndroidManifest.xml"
          unzip -l "$aab" | grep -q "base/lib/arm64-v8a/"
          cp "$aab" "$RUNNER_TEMP/CorporateWarfare-${TAG#v}-android.aab"
          cp "$apk" "$RUNNER_TEMP/CorporateWarfare-${TAG#v}-android.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -3
      - run: |
          gh release upload "$TAG" "$RUNNER_TEMP/CorporateWarfare-${TAG#v}-android.aab" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/CorporateWarfare-${TAG#v}-android.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: packageReleaseDeb
            glob: compose/shared/build/compose/binaries/main-release/deb/*.deb
          - os: windows-latest
            package: packageReleaseMsi
            glob: compose/shared/build/compose/binaries/main-release/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup show
        shell: bash
      - run: bash compose/scripts/build-engine.sh desktop
        shell: bash
      - working-directory: compose
        run: ./gradlew --no-daemon :shared:${{ matrix.package }}
        shell: bash
      - run: gh release upload "$TAG" ${{ matrix.glob }} --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      - name: AppImage (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          # packageReleaseDeb does not leave the app image folder behind, so build it.
          (cd compose && ./gradlew --no-daemon :shared:createReleaseDistributable)
          bash compose/shared/packaging/linux/build-appimage.sh "$(ls -d compose/shared/build/compose/binaries/main-release/app/*/ | head -1)" "CorporateWarfare-${TAG#v}-linux.AppImage"
          gh release upload "$TAG" "CorporateWarfare-${TAG#v}-linux.AppImage" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      # The branded setup program, attached beside the MSI for this release cycle. Players on 1.8
      # still update through the MSI; the updater prefers the setup program when a release has both.
      - name: Setup program (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        working-directory: compose
        run: ./gradlew --no-daemon :shared:packageWindowsSetup
        shell: bash
      - name: Attach the setup program (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: gh release upload "$TAG" compose/shared/build/compose/binaries/main-release/setup/*-setup.exe --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup show
      - run: brew install xcodegen
      - run: bash apple/scripts/build-engine.sh
      - run: xcodegen generate --spec apple/project.yml --project apple
      - name: Mac Catalyst build
        run: xcodebuild -project apple/CorporateWarfare.xcodeproj -scheme CorporateWarfare -configuration Release -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath apple/build/catalyst CODE_SIGNING_ALLOWED=NO build
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(find apple/build/catalyst -path '*Release-maccatalyst/*.app' -maxdepth 6 -type d | head -1)
          test -n "$app"
          # A disk image with the branded background and the drag-to-Applications arrow (unsigned).
          bash apple/scripts/make-dmg.sh "$app" "CorporateWarfare-${TAG#v}-mac.dmg"
          gh release upload "$TAG" "CorporateWarfare-${TAG#v}-mac.dmg" --clobber
