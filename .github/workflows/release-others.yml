name: Release Android, Windows, Linux and Mac
# Attaches the non-iPhone builds to a GitHub release: a signed Android APK, the Windows
# installer, the Linux package and the Mac app (Mac Catalyst, unsigned until a Mac
# distribution certificate is configured). The iPhone build goes through release.yml.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.4.0"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  android:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup show
      - run: bash compose/scripts/build-engine.sh android
      - name: Signed release APK
        working-directory: compose
        env:
          CW_ANDROID_KEY_PASSWORD: ${{ secrets.CW_ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.CW_ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "blocked: Android signing secrets missing" >&2; exit 2; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          CW_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$RUNNER_TEMP/CorporateWarfare-${TAG#v}-android.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/CorporateWarfare-${TAG#v}-android.apk" | head -3
      - run: gh release upload "$TAG" "$RUNNER_TEMP/CorporateWarfare-${TAG#v}-android.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: packageDeb
            glob: compose/shared/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            package: packageMsi
            glob: compose/shared/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup show
        shell: bash
      - run: bash compose/scripts/build-engine.sh desktop
        shell: bash
      - working-directory: compose
        run: ./gradlew --no-daemon :shared:${{ matrix.package }}
        shell: bash
      - run: gh release upload "$TAG" ${{ matrix.glob }} --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup show
      - run: brew install xcodegen
      - run: bash apple/scripts/build-engine.sh
      - run: xcodegen generate --spec apple/project.yml --project apple
      - name: Mac Catalyst build
        run: xcodebuild -project apple/CorporateWarfare.xcodeproj -scheme CorporateWarfare -configuration Release -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath apple/build/catalyst CODE_SIGNING_ALLOWED=NO build
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(find apple/build/catalyst -path '*Release-maccatalyst/*.app' -maxdepth 6 -type d | head -1)
          test -n "$app"
          ditto -c -k --keepParent "$app" "CorporateWarfare-${TAG#v}-mac.zip"
          gh release upload "$TAG" "CorporateWarfare-${TAG#v}-mac.zip" --clobber
