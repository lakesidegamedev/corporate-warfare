name: Preview release
# Builds a tester preview (Windows installer, Linux package, Android debug APK) from a branch and
# publishes it as a GitHub pre-release tagged v<version>-preview.<n>. Preview builds follow
# pre-releases in their updater, so each preview offers the next one, and the final release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build, for example feat/v1.6"
        required: true
      version:
        description: "The release this previews, for example 1.6.0"
        required: true
      preview:
        description: "Preview number, for example 2"
        required: true
permissions:
  contents: write
env:
  PROPS: -Pcw.channel=preview -Pcw.preview=${{ inputs.preview }} -Pcw.version=${{ inputs.version }}
  TAG: v${{ inputs.version }}-preview.${{ inputs.preview }}
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: packageDeb
            glob: compose/shared/build/compose/binaries/main/deb/*.deb
            name: linux.deb
          - os: windows-latest
            package: packageMsi
            glob: compose/shared/build/compose/binaries/main/msi/*.msi
            name: windows.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup show
        shell: bash
      - run: bash compose/scripts/build-engine.sh desktop
        shell: bash
      - name: Package
        working-directory: compose
        run: ./gradlew --no-daemon $PROPS :shared:${{ matrix.package }}
        shell: bash
      - name: Name the file
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.glob }} "out/CorporateWarfare-${TAG#v}-${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.name }}
          path: out/*
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup show
      - run: bash compose/scripts/build-engine.sh android
      - name: Debug APK
        working-directory: compose
        run: ./gradlew --no-daemon $PROPS :androidApp:assembleDebug
      - run: |
          mkdir -p out
          cp compose/androidApp/build/outputs/apk/debug/androidApp-debug.apk "out/CorporateWarfare-${TAG#v}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-android.apk
          path: out/*
          retention-days: 30

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Notes from the Unreleased changelog
        run: |
          awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          { echo "Tester preview of ${{ inputs.version }}. Not a release: saves may not carry over to the next build."; echo; cat notes.md; } > body.md
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" assets/* --prerelease --target "$(git rev-parse HEAD)" \
            --title "Corporate Warfare ${{ inputs.version }} preview ${{ inputs.preview }}" --notes-file body.md
