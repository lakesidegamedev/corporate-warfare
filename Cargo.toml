[workspace]
members = ["crates/cw-core", "crates/cw-cli", "crates/cw-ffi", "tools/cw-bindgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
cw-core = { path = "crates/cw-core" }
uniffi = "=0.32.0"

[profile.release]
overflow-checks = true
lto = "thin"
