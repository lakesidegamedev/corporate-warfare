[workspace]
members = [
    "crates/cw-core",
    "crates/cw-data",
    "crates/cw-sim",
    "crates/cw-ai",
    "crates/cw-session",
    "crates/cw-cli",
    "crates/cw-ffi",
    "tools/cw-bindgen",
]
resolver = "3"

[workspace.package]
version = "1.7.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
cw-core = { path = "crates/cw-core" }
cw-data = { path = "crates/cw-data" }
cw-sim = { path = "crates/cw-sim" }
cw-ai = { path = "crates/cw-ai" }
cw-session = { path = "crates/cw-session" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.149"
blake3 = "=1.8.5"
postcard = { version = "=1.1.1", features = ["alloc"] }
uniffi = "=0.32.0"

[profile.release]
overflow-checks = true
lto = "thin"
